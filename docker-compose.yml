services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cybertrace
      POSTGRES_PASSWORD: cybertrace
      POSTGRES_DB: cybertrace
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybertrace"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://cybertrace:cybertrace@db:5432/cybertrace
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
